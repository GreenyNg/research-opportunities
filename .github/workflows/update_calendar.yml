name: Generate & Validate Calendar

on:
  push:
    paths:
      - 'opportunities.json'
      - 'build_calendar.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build ICS Calendar
        run: python build_calendar.py

      - name: Commit and Push Updated ICS
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add research_calendar.ics
          if git diff --staged --quiet; then
            echo "No changes in calendar output."
          else
            git commit -m "Auto-generate updated research_calendar.ics"
            git push
          fi